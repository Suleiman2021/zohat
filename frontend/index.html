<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183C60">
<title>زوهات — نظام الشحن والتخليص</title>
<link rel="manifest" href="manifest.json">
<!-- ?v=43 يكسر أي كاش قديم لدى المتصفحات التي علِقت على نسخة سابقة -->
<link rel="stylesheet" href="css/style.css?v=43">
</head>
<body>
<!-- شاشة الدخول -->
<div id="login" class="login-screen">
  <form id="loginForm" class="login-card">
    <img src="icons/logo.svg" class="logo-login" alt="زوهات — ZOHAT Customs Clearance">
    <h2>تسجيل الدخول</h2>
    <input name="username" placeholder="اسم المستخدم" required autocomplete="username">
    <input name="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password">
    <button type="submit">دخول</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<!-- التطبيق -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-head">
      <img src="icons/logo-white.svg" class="logo-side" alt="زوهات">
      <button id="navToggle" class="nav-toggle" aria-label="فتح القائمة">☰</button>
    </div>
    <nav id="nav"></nav>
    <div class="userbox">
      <div id="userName"></div><div id="userRole" class="role"></div>
      <button id="logout">خروج</button>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>

<!-- إشعارات مؤقتة (toast) -->
<div id="toasts" aria-live="polite"></div>

<!-- شبكة أمان: أي خطأ برمجي يوقف تحميل الملفات كان يترك الشاشة صامتة تماماً
     (لا يُربط حتى زر الدخول). هذا يُظهره بوضوح بدل الصمت. -->
<script>
window.addEventListener("error", e=>{
  const m = e.message || "خطأ غير معروف";
  let box = document.getElementById("fatalErr");
  if(!box){
    box = document.createElement("div");
    box.id = "fatalErr";
    box.style.cssText = "position:fixed;inset-inline:0;top:0;z-index:9999;background:#C0392B;"
      + "color:#fff;padding:12px 16px;font:13px/1.6 'Segoe UI',Tahoma,sans-serif;direction:rtl;"
      + "box-shadow:0 4px 14px rgba(0,0,0,.35)";
    document.body && document.body.appendChild(box);
  }
  if(box) box.textContent = "⚠ تعذّر تحميل التطبيق: " + m + " — حدّث الصفحة، وإن تكرّر أبلغ الدعم بهذه الرسالة.";
});
</script>
<script src="js/api.js?v=43"></script>
<script src="js/app.js?v=43"></script>
<script>
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
