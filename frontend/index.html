<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183C60">
<title>زوهات — نظام الشحن والتخليص</title>
<link rel="manifest" href="manifest.json">
<!-- ?v=24 يكسر أي كاش قديم لدى المتصفحات التي علِقت على نسخة سابقة -->
<link rel="stylesheet" href="css/style.css?v=24">
</head>
<body>
<!-- شاشة الدخول -->
<div id="login" class="login-screen">
  <form id="loginForm" class="login-card">
    <img src="icons/logo.svg" class="logo-login" alt="زوهات — ZOHAT Customs Clearance">
    <h2>تسجيل الدخول</h2>
    <input name="username" placeholder="اسم المستخدم" required autocomplete="username">
    <div class="pw-wrap">
      <input name="password" id="pw" type="password" placeholder="كلمة المرور" required autocomplete="current-password">
      <button type="button" id="pwToggle" class="pw-eye" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور">
        <!-- عين مفتوحة: الكلمة مخفيّة (اضغط للإظهار) -->
        <svg id="pwIconShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <!-- عين مشطوبة: الكلمة ظاهرة (اضغط للإخفاء) -->
        <svg id="pwIconHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <button type="submit">دخول</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<!-- التطبيق -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-head">
      <img src="icons/logo-white.svg" class="logo-side" alt="زوهات">
      <button id="navToggle" class="nav-toggle" aria-label="فتح القائمة">☰</button>
    </div>
    <nav id="nav"></nav>
    <div class="userbox">
      <div id="userName"></div><div id="userRole" class="role"></div>
      <button id="logout">خروج</button>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>

<!-- إشعارات مؤقتة (toast) -->
<div id="toasts" aria-live="polite"></div>

<script src="js/api.js?v=24"></script>
<script src="js/app.js?v=24"></script>
<script>
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
