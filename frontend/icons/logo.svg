<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 430 170" role="img" aria-label="ZOHAT زوهات — Customs Clearance">
  <!-- الشعار الدائري: قوسان انسيابيان (تركواز + ذهبي) -->
  <circle cx="345" cy="66" r="52" fill="none" stroke="#009CB4" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="230 97" transform="rotate(-35 345 66)"/>
  <circle cx="345" cy="66" r="60" fill="none" stroke="#C9A227" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="96 281" transform="rotate(150 345 66)"/>

  <!-- الطائرة أعلى الدائرة -->
  <path d="M2 21l21-9L2 3v7l15 2-15 2z" fill="#183C60"
        transform="translate(352 -12) scale(1.35) rotate(14)"/>

  <!-- الباخرة (حاويات + هيكل) -->
  <g transform="translate(300 62)">
    <rect x="8"  y="0" width="10" height="10" fill="#009CB4"/>
    <rect x="20" y="0" width="10" height="10" fill="#006C84"/>
    <rect x="32" y="0" width="10" height="10" fill="#009CB4"/>
    <path d="M0 12 L7 24 H43 L50 12 Z" fill="#183C60"/>
  </g>

  <!-- الشاحنة -->
  <g transform="translate(338 92)">
    <rect x="0" y="0" width="26" height="14" rx="2" fill="#fff" stroke="#183C60" stroke-width="2"/>
    <path d="M26 4 h8 l5 5 v5 h-13 z" fill="#183C60"/>
    <circle cx="8"  cy="16" r="3.4" fill="#183C60"/>
    <circle cx="20" cy="16" r="3.4" fill="#183C60"/>
    <circle cx="33" cy="16" r="3.4" fill="#183C60"/>
  </g>

  <!-- الاسم اللاتيني -->
  <text x="16" y="56" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-weight="800"
        font-size="46" letter-spacing="1"><tspan fill="#009CB4">ZO</tspan><tspan fill="#183C60">HAT</tspan></text>

  <!-- الاسم العربي بين خطّين ذهبيين -->
  <line x1="16"  y1="76" x2="66"  y2="76" stroke="#C9A227" stroke-width="2"/>
  <text x="112" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif"
        font-weight="700" font-size="24" fill="#006C84">زوهــات</text>
  <line x1="158" y1="76" x2="208" y2="76" stroke="#C9A227" stroke-width="2"/>

  <!-- السطر التعريفي -->
  <text x="16" y="112" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-weight="700"
        font-size="14" letter-spacing="3" fill="#183C60">CUSTOMS CLEARANCE</text>
  <text x="16" y="134" font-family="Segoe UI, Tahoma, Arial, sans-serif"
        font-size="13" fill="#5b7186">تخليص جمركي باحترافية وثقة</text>
</svg>
